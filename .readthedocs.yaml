# Read the Docs build configuration for the fastrho documentation.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Minimal MyST documentation with no autodoc or executed examples. The build does not
# import fastrho and needs neither torch, CUDA, nor mamba-ssm.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
  - htmlzip
