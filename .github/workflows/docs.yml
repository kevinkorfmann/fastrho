name: docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".readthedocs.yaml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - ".readthedocs.yaml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create a fresh example environment
        run: |
          python -m venv "$RUNNER_TEMP/fastrho-example-env"
          "$RUNNER_TEMP/fastrho-example-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/fastrho-example-env/bin/python" -m pip install ".[io]"
      - name: Run installed-package and manuscript examples
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/fastrho-example-env/bin/python"
          "$GITHUB_WORKSPACE/scripts/smoke_fresh_examples.py"
          --repo-root "$GITHUB_WORKSPACE"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs "$RUNNER_TEMP/site"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [examples, build]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
