name: api-tests

# CPU/package tests. CUDA-only model tests self-skip when the optional inference
# stack is absent; every torch-free module, package artifact, and public release record is
# exercised on supported Python versions.

on:
  push:
    paths:
      - "fastrho/**"
      - "tests/test_*.py"
      - "scripts/release_check.py"
      - "scripts/*model_release.py"
      - "scripts/fetch_model_release.py"
      - "models/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/api-tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      FASTRHO_MANUSCRIPT_ROOT: ${{ github.workspace }}/tmp/reproduce/manuscript
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --quiet -e ".[io,dev]"

      - name: Fetch the locked Phase 2 manuscript
        run: python reproduce/fetch_manuscript.py

      - name: Run CPU/package tests
        run: python -m pytest -q

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build wheel and source distribution
        run: python -m build
